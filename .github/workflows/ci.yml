name: CI

# Runs on every push to dev or main, and on PRs targeting main
on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [main]

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    runs-on: ubuntu-latest

    # Spin up a local Postgres alongside the test runner
    services:
      postgres:
        image: postgres:17 # match Heroku Postgres 17 and docker-compose.yml
        env:
          POSTGRES_DB: gacha_tracker
          POSTGRES_USER: developer
          POSTGRES_PASSWORD: devpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Apply the database schema (same SQL file used by Docker locally)
      - name: Apply database schema
        env:
          PGPASSWORD: devpassword
        run: psql -h localhost -U developer -d gacha_tracker -f database/init/01-schema.sql

      - name: Build TypeScript
        run: npm run build

      # Pure unit tests for the upstream-sync planner (no database or network needed)
      - name: "Unit tests: sync planner"
        run: npm run test:sync

      # Pure unit tests for the admin-facing email mask (no database or network needed)
      - name: "Unit tests: email mask"
        run: npm run test:mask

      # Start the API in the background; auto-import will seed game data on startup
      - name: Start API server
        env:
          DATABASE_URL: postgresql://developer:devpassword@localhost:5432/gacha_tracker
          NODE_ENV: development
          PORT: 4000
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          PASSWORD_PEPPER: ${{ secrets.PASSWORD_PEPPER }}
          REGISTRATION_TOKEN: ${{ secrets.REGISTRATION_TOKEN }}
          GAME_DATA_SOURCE_URL: https://raw.githubusercontent.com/cicerakes/Game-Time-Master/refs/heads/master/game-data.js
          GAME_DATA_FALLBACK_PATH: ./data/game-data-backup.js
        run: node dist/index.js &

      # Poll the health endpoint until the API is ready (up to 30s)
      - name: Wait for API to be ready
        run: |
          echo "Waiting for API..."
          for i in {1..15}; do
            if curl -sf http://localhost:4000/gdt/health > /dev/null; then
              echo "API is ready!"
              exit 0
            fi
            echo "Attempt $i — not ready yet, retrying in 2s..."
            sleep 2
          done
          echo "API failed to start in time"
          exit 1

      - name: Install Newman
        run: npm install -g newman

      # --- Test Collections ---

      - name: "Test: Public Endpoints (health, status, games)"
        run: |
          newman run "test/postman/Test Public Endpoints.postman_collection.json" \
            --environment "test/postman/Local-gacha-daily-tracker.postman_environment.json" \
            --reporters cli

      - name: "Test: Auth Edge Cases (registration + login validation)"
        run: |
          newman run "test/postman/Test Auth Edge Cases.postman_collection.json" \
            --environment "test/postman/Local-gacha-daily-tracker.postman_environment.json" \
            --reporters cli

      - name: "Test: CI Auth Flow (register → login → authenticated routes → cleanup)"
        env:
          REGISTRATION_TOKEN: ${{ secrets.REGISTRATION_TOKEN }}
        run: |
          newman run "test/postman/Test CI Auth Flow.postman_collection.json" \
            --environment "test/postman/Local-gacha-daily-tracker.postman_environment.json" \
            --env-var "registration_token=$REGISTRATION_TOKEN" \
            --reporters cli

      - name: "Test: New Features (leaderboard + password reset edge cases)"
        run: |
          newman run "test/postman/Test New Features.postman_collection.json" \
            --environment "test/postman/Local-gacha-daily-tracker.postman_environment.json" \
            --reporters cli

      # --- Upstream game sync (POST /gdt/admin/import/games) ---
      # Needs an admin user, which can only be created by bumping the role in SQL, so a script
      # prepares an admin + a regular user + synthetic games and hands us their JWTs.
      - name: "Prepare: admin/regular test users + synthetic games for the sync tests"
        env:
          REGISTRATION_TOKEN: ${{ secrets.REGISTRATION_TOKEN }}
          BASE_URL: http://localhost:4000
          PGHOST: localhost
          PGUSER: developer
          PGPASSWORD: devpassword
          PGDATABASE: gacha_tracker
        run: |
          # Redirect to a file (not eval "$(...)") so a failing setup fails this step.
          bash test/ci/sync-test-setup.sh > /tmp/sync-env.sh
          source /tmp/sync-env.sh
          echo "::add-mask::$ADMIN_TOKEN"
          echo "::add-mask::$USER_TOKEN"
          echo "ADMIN_TOKEN=$ADMIN_TOKEN" >> "$GITHUB_ENV"
          echo "USER_TOKEN=$USER_TOKEN" >> "$GITHUB_ENV"

      - name: "Test: Game Sync (tracked games survive, preview writes nothing, nothing deleted)"
        run: |
          newman run "test/postman/Test Game Sync.postman_collection.json" \
            --environment "test/postman/Local-gacha-daily-tracker.postman_environment.json" \
            --env-var "admin_token=$ADMIN_TOKEN" \
            --env-var "user_token=$USER_TOKEN" \
            --reporters cli

      - name: Clean up sync test data
        if: always()
        env:
          PGHOST: localhost
          PGUSER: developer
          PGPASSWORD: devpassword
          PGDATABASE: gacha_tracker
        run: bash test/ci/sync-test-cleanup.sh
